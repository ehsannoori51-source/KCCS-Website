<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Message sent · KCCS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,sans-serif;color:#0b1424;
  background:radial-gradient(700px 480px at 85% -10%,rgba(34,184,240,.18),transparent 60%),#f5f8fc}
.card{max-width:440px;width:100%;background:#fff;border:1px solid rgba(11,20,36,.08);border-radius:22px;padding:36px;text-align:center;box-shadow:0 8px 28px rgba(11,20,36,.06)}
.ok{width:60px;height:60px;border-radius:50%;background:#e8f3ff;color:#0a6cff;display:grid;place-items:center;margin:0 auto 20px}
.ok svg{width:28px;height:28px}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;letter-spacing:-.03em}
p{color:#5a6678;margin:10px 0 26px}
a{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;background:#0b1424;color:#fff;text-decoration:none;font-weight:600}
a:hover{background:#0a6cff}
</style>
</head>
<body>
<div class="card">
  <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
  <h1>Message received</h1>
  <p>Thank you for contacting Kabul Central Cold Storage. Our team will reply within a few hours during business hours.</p>
  <a href="./">Back to the website</a>
</div>
</body>
</html>
